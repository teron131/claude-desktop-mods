<svg xmlns="http://www.w3.org/2000/svg" width="960" height="992" viewBox="0 0 960 992" role="img" aria-labelledby="title desc">
  <title id="title">answer-indicator</title>
  <desc id="desc">A desktop turn with progress notes, collapsed commands, a widget, an image, a Stop hook that sends Claude back to work, and file changes; only the answers before and after the hook carry the orange rail.</desc>
  <style>text { font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Inter, Helvetica, Arial, sans-serif; }</style>
  <rect width="960" height="992" rx="16" fill="#181818"/>
  <rect x="348.0" y="40.0" width="260.0" height="46.0" rx="16" fill="#242424"/>
  <rect x="364.0" y="58.5" width="210.0" height="9.0" rx="4.5" fill="#4a4a4a"/>
  <rect x="48.0" y="122.0" width="380.0" height="9.0" rx="4.5" fill="#3c3c3c"/>
  <text x="48.0" y="169.0" font-size="15" fill="#9c9c9c">Read 2 files</text>
  <path d="M138.0 162.0 l3.5 2.75 l-3.5 2.75 z" fill="#9c9c9c"/>
  <text x="48.0" y="205.0" font-size="15" fill="#9c9c9c">Ran 3 commands</text>
  <path d="M177.8 198.0 l3.5 2.75 l-3.5 2.75 z" fill="#9c9c9c"/>
