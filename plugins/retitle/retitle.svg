<svg xmlns="http://www.w3.org/2000/svg" width="960" height="522" viewBox="0 0 960 522" role="img" aria-labelledby="title desc">
  <title id="title">retitle</title>
  <desc id="desc">Seven turns of one session: the first prompt names it Mobile Revenue Chart, a side question and more chart work keep it, and once two requests in a row are about a PDF export the main agent renames it Dashboard PDF Export.</desc>
  <style>text { font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Inter, Helvetica, Arial, sans-serif; }</style>
  <rect width="960" height="522" rx="16" fill="#181818"/>
  <text x="48.0" y="42.0" font-size="12" fill="#8e8e8e" font-weight="600">Turn</text>
  <text x="88.0" y="42.0" font-size="12" fill="#8e8e8e" font-weight="600">Your prompt, and the title note retitle adds</text>
  <text x="552.0" y="42.0" font-size="12" fill="#8e8e8e" font-weight="600">The main agent</text>
  <text x="724.0" y="42.0" font-size="12" fill="#8e8e8e" font-weight="600">Session title</text>
  <circle cx="59.0" cy="91.0" r="11" fill="#2c2c2c"/>
  <text x="59.0" y="95.5" font-size="12.5" fill="#efefef" font-weight="600" text-anchor="middle">1</text>
  <rect x="88.0" y="75.0" width="308.5" height="32.0" rx="12" fill="#242424"/>
  <text x="102.0" y="95.8" font-size="13.5" fill="#efefef">Make the revenue chart readable on phones</text>
  <rect x="404.5" y="81.0" width="44.0" height="20.0" rx="10" fill="none" stroke="#D97757" stroke-width="1" stroke-dasharray="4 3"/>
  <text x="426.5" y="95.0" font-size="11.5" fill="#D97757" font-weight="500" text-anchor="middle">note</text>
  <text x="552.0" y="89.0" font-size="13.5" fill="#D97757" font-weight="600">Names it</text>
  <text x="552.0" y="106.0" font-size="12" fill="#bdbdbd">replacing the app’s own title</text>
  <line x1="620.5" y1="84.5" x2="720.0" y2="84.5" stroke="#D97757" stroke-width="1" stroke-linecap="round"/>
  <line x1="48.0" y1="118.0" x2="708.0" y2="118.0" stroke="#242424" stroke-width="1" stroke-linecap="round"/>
  <circle cx="59.0" cy="145.0" r="11" fill="#2c2c2c"/>
  <text x="59.0" y="149.5" font-size="12.5" fill="#efefef" font-weight="600" text-anchor="middle">2</text>
  <rect x="88.0" y="129.0" width="226.5" height="32.0" rx="12" fill="#242424"/>
  <text x="102.0" y="149.8" font-size="13.5" fill="#efefef">Stack the legend below 400 px</text>
  <rect x="322.5" y="135.0" width="44.0" height="20.0" rx="10" fill="none" stroke="#D97757" stroke-width="1" stroke-dasharray="4 3"/>
  <text x="344.5" y="149.0" font-size="11.5" fill="#D97757" font-weight="500" text-anchor="middle">note</text>
  <text x="552.0" y="150.0" font-size="13.5" fill="#bdbdbd" font-weight="500">Keeps it</text>
  <line x1="48.0" y1="172.0" x2="708.0" y2="172.0" stroke="#242424" stroke-width="1" stroke-linecap="round"/>
  <circle cx="59.0" cy="199.0" r="11" fill="#2c2c2c"/>
  <text x="59.0" y="203.5" font-size="12.5" fill="#efefef" font-weight="600" text-anchor="middle">3</text>
  <rect x="88.0" y="183.0" width="379.2" height="32.0" rx="12" fill="#242424"/>
  <text x="102.0" y="203.8" font-size="13.5" fill="#efefef">Quick one: what’s the difference between rem and em?</text>
  <rect x="475.2" y="189.0" width="44.0" height="20.0" rx="10" fill="none" stroke="#D97757" stroke-width="1" stroke-dasharray="4 3"/>
  <text x="497.2" y="203.0" font-size="11.5" fill="#D97757" font-weight="500" text-anchor="middle">note</text>
  <text x="552.0" y="197.0" font-size="13.5" fill="#bdbdbd" font-weight="500">Keeps it</text>
  <text x="552.0" y="214.0" font-size="12" fill="#bdbdbd">one side question</text>
  <line x1="48.0" y1="226.0" x2="708.0" y2="226.0" stroke="#242424" stroke-width="1" stroke-linecap="round"/>
  <circle cx="59.0" cy="253.0" r="11" fill="#2c2c2c"/>
  <text x="59.0" y="257.5" font-size="12.5" fill="#efefef" font-weight="600" text-anchor="middle">4</text>
  <rect x="88.0" y="237.0" width="290.5" height="32.0" rx="12" fill="#242424"/>
  <text x="102.0" y="257.8" font-size="13.5" fill="#efefef">The tooltips overlap on small screens too</text>
  <rect x="386.5" y="243.0" width="44.0" height="20.0" rx="10" fill="none" stroke="#D97757" stroke-width="1" stroke-dasharray="4 3"/>
  <text x="408.5" y="257.0" font-size="11.5" fill="#D97757" font-weight="500" text-anchor="middle">note</text>
  <text x="552.0" y="258.0" font-size="13.5" fill="#bdbdbd" font-weight="500">Keeps it</text>
  <line x1="48.0" y1="280.0" x2="708.0" y2="280.0" stroke="#242424" stroke-width="1" stroke-linecap="round"/>
  <circle cx="59.0" cy="307.0" r="11" fill="#2c2c2c"/>
  <text x="59.0" y="311.5" font-size="12.5" fill="#efefef" font-weight="600" text-anchor="middle">5</text>
  <rect x="88.0" y="291.0" width="300.5" height="32.0" rx="12" fill="#242424"/>
  <text x="102.0" y="311.8" font-size="13.5" fill="#efefef">Now export the dashboard as a PDF report</text>
  <rect x="396.5" y="297.0" width="44.0" height="20.0" rx="10" fill="none" stroke="#D97757" stroke-width="1" stroke-dasharray="4 3"/>
  <text x="418.5" y="311.0" font-size="11.5" fill="#D97757" font-weight="500" text-anchor="middle">note</text>
  <text x="552.0" y="305.0" font-size="13.5" fill="#bdbdbd" font-weight="500">Keeps it</text>
  <text x="552.0" y="322.0" font-size="12" fill="#bdbdbd">still mostly chart work</text>
  <line x1="48.0" y1="334.0" x2="708.0" y2="334.0" stroke="#242424" stroke-width="1" stroke-linecap="round"/>
  <circle cx="59.0" cy="361.0" r="11" fill="#2c2c2c"/>
  <text x="59.0" y="365.5" font-size="12.5" fill="#efefef" font-weight="600" text-anchor="middle">6</text>
  <rect x="88.0" y="345.0" width="262.0" height="32.0" rx="12" fill="#242424"/>
  <text x="102.0" y="365.8" font-size="13.5" fill="#efefef">Add page numbers and a cover page</text>
  <rect x="358.0" y="351.0" width="44.0" height="20.0" rx="10" fill="none" stroke="#D97757" stroke-width="1" stroke-dasharray="4 3"/>
  <text x="380.0" y="365.0" font-size="11.5" fill="#D97757" font-weight="500" text-anchor="middle">note</text>
  <text x="552.0" y="359.0" font-size="13.5" fill="#D97757" font-weight="600">Renames it</text>
  <text x="552.0" y="376.0" font-size="12" fill="#bdbdbd">the work has moved on</text>
  <line x1="636.5" y1="354.5" x2="720.0" y2="354.5" stroke="#D97757" stroke-width="1" stroke-linecap="round"/>
  <line x1="48.0" y1="388.0" x2="708.0" y2="388.0" stroke="#242424" stroke-width="1" stroke-linecap="round"/>
  <circle cx="59.0" cy="415.0" r="11" fill="#2c2c2c"/>
  <text x="59.0" y="419.5" font-size="12.5" fill="#efefef" font-weight="600" text-anchor="middle">7</text>
  <rect x="88.0" y="399.0" width="244.0" height="32.0" rx="12" fill="#242424"/>
  <text x="102.0" y="419.8" font-size="13.5" fill="#efefef">Make the PDF use the app’s fonts</text>
  <rect x="340.0" y="405.0" width="44.0" height="20.0" rx="10" fill="none" stroke="#D97757" stroke-width="1" stroke-dasharray="4 3"/>
  <text x="362.0" y="419.0" font-size="11.5" fill="#D97757" font-weight="500" text-anchor="middle">note</text>
  <text x="552.0" y="420.0" font-size="13.5" fill="#bdbdbd" font-weight="500">Keeps it</text>
  <rect x="724.0" y="70.0" width="188.0" height="258.0" rx="12" fill="#242424" stroke="#2e2e2e" stroke-width="1"/>
  <circle cx="740.0" cy="84.5" r="3.5" fill="#D97757"/>
  <text x="752.0" y="89.0" font-size="13.5" fill="#efefef" font-weight="500">Mobile Revenue Chart</text>
  <rect x="724.0" y="340.0" width="188.0" height="96.0" rx="12" fill="#242424" stroke="#2e2e2e" stroke-width="1"/>
  <circle cx="740.0" cy="354.5" r="3.5" fill="#D97757"/>
  <text x="752.0" y="359.0" font-size="13.5" fill="#efefef" font-weight="500">Dashboard PDF Export</text>
  <text x="752.0" y="378.0" font-size="12" fill="#6e6e6e" text-decoration="line-through">Mobile Revenue Chart</text>
  <text x="48.0" y="470.0" font-size="13" fill="#bdbdbd">Every prompt carries a short note with the current title. The main agent already holds the whole session, so it judges the title against your</text>
  <text x="48.0" y="489.0" font-size="13" fill="#bdbdbd">last several requests and calls the rename tool only once they’ve moved past it.</text>
</svg>
