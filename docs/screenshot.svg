  <g transform="translate(929.23 870.35)" fill="none" stroke="#efefef" stroke-width="1.15"><rect x="-3.2" y="-5.6" width="6.4" height="9" rx="3.2"/><path d="M-6.3 -0.4V0.05A6.3 6.3 0 0 0 6.3 0.05V-0.4M-0.45 6.35V9.2"/></g>
  <text class="auto" x="35.05" y="917.50" textLength="27.59" fill="#efefef">Auto</text>
