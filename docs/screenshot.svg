  <text class="ui" x="105.95" y="796.00" textLength="57.00" fill="#9d9d9d">Thinking</text>
  <rect x="15" y="848.5" width="940" height="54" rx="20" fill="#171717"/>
  <rect x="20.23" y="850.54" width="929.82" height="42.16" rx="13" fill="#303030" stroke="#404040" stroke-width="1"/>
  <g transform="translate(41.04 871.86)" stroke="#efefef" stroke-width="1.1" stroke-linecap="round"><path d="M-5.6 0H5.6M0 -5.6V5.6"/></g>
  <text class="ui" x="62.41" y="877.00" textLength="221.15" fill="#888888">⏎ to send, ⌘⏎ to queue for later</text>
