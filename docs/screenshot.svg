  <text class="total" x="434.33" y="917.00" textLength="357.12" fill="#9d9d9d">32h 53m 11s · 2.63B (99%) in · 8.73M out · 98 tps · $1054.27</text>
  <text class="model" x="806.53" y="917.50" textLength="53.17" fill="#efefef">Opus 5.5</text>
  <text class="model" x="866.92" y="917.50" textLength="24.52" fill="#9d9d9d">Max</text>
  <g transform="translate(901.09 912.62)" fill="none" stroke="#d5ab56" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"><path d="M-1.73 -2.35Q0 -5.25 1.73 -2.35L5.3 3.7H-5.3ZM0 -1.3V-0.2"/><circle cy="1.6" r="0.8" fill="#d5ab56" stroke="none"/></g>
  <g transform="translate(929.22 912.55)" fill="none" stroke-width="2"><circle r="5.75" stroke="#474747"/><circle r="5.75" stroke="#2c7ad2" stroke-dasharray="10.8 40" transform="rotate(-95)"/></g>
